name: ZIP restore size integrity qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-zip-restore-size-mismatch-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source formatting
        run: test -z "$(gofmt -l snapshot/restore/zip_output.go snapshot/restore/zip_output_size_test.go)"
      - name: Exercise actual ZIP restore code and expected-size mismatch
        run: go test -count=1 -run TestZipOutputDetectsSnapshotLengthMismatch ./snapshot/restore
      - name: Additional targeted restore tests
        run: go test -count=1 ./snapshot/restore
